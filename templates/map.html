<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>지도 생성하기</title>
  </head>
  <body>
    <!-- 지도를 표시할 div 입니다 -->
    <div id="map" style="width: 100%; height: 350px"></div>

    <!-- 1. 카카오 지도 API 로드 (&autoload=false 적용 상태) -->
    <script
      type="text/javascript"
      src="//dapi.kakao.com/v2/maps/sdk.js?appkey={{ kakao_map_key }}&libraries=services&autoload=false"
    ></script>

    <script>
      // 2. kakao.maps.load 콜백 함수로 감싸서 API 로드가 완전히 끝난 후 실행되도록 제어합니다.
      kakao.maps.load(function () {
        var mapContainer = document.getElementById("map"), // 지도를 표시할 div
          mapOption = {
            center: new kakao.maps.LatLng(33.450701, 126.570667), // 지도의 중심좌표
            level: 3, // 지도의 확대 레벨
          };

        // 3. 이제 안전하게 지도를 생성할 수 있습니다.
        var map = new kakao.maps.Map(mapContainer, mapOption);
      });
    </script>
  </body>
</html>
