<html>
  <head>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
  </head>
  <body>
    <div class="container">
      <h1>인공지능 신문기사 정보</h1>

      <p>인공지능에 관한 최신 기사 , 인기 기사 정보를 보여드립니다.</p>

      <div>
        <p>신문기사</p>
        <form action="/search">
          <input type="text" name="keyword" placeholder="검색어를 입력하세요" />
        </form>
      </div>

      <div>
        <p>네이버 검색</p>
        <form action="/search_naver" method="get">
          <input type="text" name="keyword" placeholder="검색어를 입력하세요" />
        </form>
      </div>
    </div>
  </body>
</html>
