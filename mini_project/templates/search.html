<html>
  <head>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
  </head>
  <body>
    <div class="container">
    <h1>검색 결과</h1>
    <p>AI 뉴스 검색 결과입니다.</p>
       
    <br><br>
    
    <table class="striped">
      <thead data-theme="light">
        <tr>
          <th>No</th>
          <th>기사 제목</th>
          <th>출처</th>
          <th>날짜</th>
          <th>링크</th>
        </tr>
      </thead>
      <tbody>
        {% for i, job in jobs %}
        <tr>
          <td>{{ i + 1 }}</td>
          <td>{{ job['title'] }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    <div class="container">
      <button onclick="location.href = '/'">홈으로</button>
    </div>
    
  </body>
</html>
